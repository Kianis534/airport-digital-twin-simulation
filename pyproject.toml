[project]
name = "airport-digital-twin-simulation"
version = "2.0.0"
description = "Airport digital twin: SimPy discrete-event simulation with XGBoost and LSTM models, a FastAPI service and a Next.js dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Abdullah Raja" }]
requires-python = ">=3.10"
keywords = ["digital twin", "airport simulation", "simpy", "discrete event simulation", "xgboost", "lstm", "fastapi"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend_nextjs", ".venv", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["simulation", "ml_models", "preprocessing", "backend_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*",
]
