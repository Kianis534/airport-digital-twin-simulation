name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python -m simulation --security-lanes 4 --traffic 20

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t airport-twin-api .
      - name: Smoke test API container
        run: |
          docker run -d --name api -p 8000:8000 airport-twin-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs -X POST http://localhost:8000/api/v1/simulations -H 'Content-Type: application/json' -d '{"security_lanes": 4}' | head -c 300
          docker logs api | tail -5
      - name: Build dashboard image
        run: docker build -t airport-twin-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 frontend_nextjs
