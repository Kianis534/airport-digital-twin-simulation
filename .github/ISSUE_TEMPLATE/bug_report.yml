name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or page, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Open ...\n3. See error"
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, Node version, browser"
