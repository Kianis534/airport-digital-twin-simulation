# docker compose up --build   ->   dashboard on http://localhost:3000, API on http://localhost:8000/docs
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO

  web:
    build:
      context: ./frontend_nextjs
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
